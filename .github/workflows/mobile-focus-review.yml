name: Mobile focus review

on:
  push:
    paths:
      - '.github/workflows/mobile-focus-review.yml'
      - 'src/**'
      - 'public/**'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify build
        run: npm run build

      - name: Start review server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/safra-focus.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/safra-focus.log
          exit 1

      - name: Diagnose and capture mobile viewport states
        run: |
          mkdir -p focus-screenshots
          cat > focus.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          const base = 'http://127.0.0.1:4173/';

          async function ready(hash) {
            await page.goto(`${base}${hash}`, { waitUntil: 'networkidle' });
            await page.evaluate(() => document.fonts?.ready);
            await page.waitForTimeout(300);
          }

          await ready('#/shop');
          await page.locator('.fs-shop-controls-wrap').scrollIntoViewIfNeeded();
          await page.waitForTimeout(250);
          await page.screenshot({ path: 'focus-screenshots/01-shop-controls-mobile-viewport.png', fullPage: false });
          await page.evaluate(() => window.scrollBy(0, 650));
          await page.waitForTimeout(250);
          await page.screenshot({ path: 'focus-screenshots/02-shop-controls-sticky-mobile-viewport.png', fullPage: false });

          await ready('#/product/tala-mini-bag');
          const buybar = page.locator('.fs-mobile-buybar');
          console.log('BUYBAR count:', await buybar.count());
          console.log('BUYBAR visible at top:', await buybar.isVisible().catch(() => false));
          console.log('BUYBAR top state:', await page.evaluate(() => {
            const el = document.querySelector('.fs-mobile-buybar');
            if (!el) return null;
            const s = getComputedStyle(el);
            const r = el.getBoundingClientRect();
            return { display:s.display, position:s.position, visibility:s.visibility, opacity:s.opacity, zIndex:s.zIndex, bottom:s.bottom, left:r.left, top:r.top, right:r.right, rectBottom:r.bottom, width:r.width, height:r.height, innerWidth:innerWidth, innerHeight:innerHeight };
          }));

          await page.locator('.fs-mobile-pdp-core').scrollIntoViewIfNeeded();
          await page.waitForTimeout(250);
          await page.screenshot({ path: 'focus-screenshots/03-product-purchase-mobile-viewport.png', fullPage: false });
          await page.evaluate(() => window.scrollBy(0, 650));
          await page.waitForTimeout(250);
          console.log('BUYBAR visible after scroll:', await buybar.isVisible().catch(() => false));
          console.log('BUYBAR scrolled state:', await page.evaluate(() => {
            const el = document.querySelector('.fs-mobile-buybar');
            if (!el) return null;
            const s = getComputedStyle(el);
            const r = el.getBoundingClientRect();
            return { display:s.display, position:s.position, visibility:s.visibility, opacity:s.opacity, zIndex:s.zIndex, bottom:s.bottom, left:r.left, top:r.top, right:r.right, rectBottom:r.bottom, width:r.width, height:r.height, innerWidth:innerWidth, innerHeight:innerHeight };
          }));
          await page.screenshot({ path: 'focus-screenshots/04-product-buybar-sticky-mobile-viewport.png', fullPage: false });

          await browser.close();
          EOF
          node focus.mjs

      - name: Upload focused screenshots
        uses: actions/upload-artifact@v4
        with:
          name: safra-mobile-focus-review
          path: focus-screenshots
          retention-days: 3
