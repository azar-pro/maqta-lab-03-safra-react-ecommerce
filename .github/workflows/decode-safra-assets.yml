name: Decode SAFRA image assets

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/safra-staging/**'
      - '.github/workflows/decode-safra-assets.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode staged high-resolution image payloads
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          stage="public/assets/safra-staging"
          ready="$stage/.ready"
          checksums="$stage/checksums.sha256"

          if [ ! -f "$ready" ]; then
            echo "SAFRA staging is not marked ready yet."
            exit 0
          fi

          payloads=("$stage"/*.b64)
          if [ ${#payloads[@]} -eq 0 ]; then
            echo "No SAFRA payloads found."
            exit 1
          fi
          if [ ! -f "$checksums" ]; then
            echo "Missing SAFRA checksum manifest."
            exit 1
          fi

          mkdir -p public/assets/safra

          for payload in "${payloads[@]}"; do
            filename="$(basename "$payload" .b64)"
            output="public/assets/safra/$filename"
            tr -d '\n\r' < "$payload" | base64 --decode > "$output"
            echo "Decoded $output"
          done

          (
            cd public/assets/safra
            sha256sum -c ../safra-staging/checksums.sha256
          )

          rm -rf "$stage"

      - name: Commit decoded assets
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No decoded assets to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/safra public/assets/safra-staging
          git commit -m "Decode SAFRA high-resolution photography [skip ci]"
          git push origin HEAD:main
