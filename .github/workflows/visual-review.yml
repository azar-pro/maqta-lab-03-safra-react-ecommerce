name: Visual review

on:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - '.github/workflows/visual-review.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright and accessibility audit tools
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Start Vite review server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/safra-review.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/safra-review.log
          exit 1

      - name: Capture desktop and mobile review screens
        run: |
          mkdir -p screenshots
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:4173/';
          const cart = [
            { key: 'tala-mini-bag-Sand', productId: 'tala-mini-bag', color: 'Sand', quantity: 1 },
            { key: 'noor-hoops-Gold', productId: 'noor-hoops', color: 'Gold', quantity: 1 },
            { key: 'azur-sunglasses-Tortoise', productId: 'azur-sunglasses', color: 'Tortoise', quantity: 1 },
          ];

          async function warmLazyMedia(page) {
            await page.evaluate(async () => {
              const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
              const step = Math.max(520, Math.floor(window.innerHeight * 0.78));
              let y = 0;
              let lastHeight = 0;

              while (y < document.documentElement.scrollHeight && document.documentElement.scrollHeight !== lastHeight) {
                lastHeight = document.documentElement.scrollHeight;
                for (; y < lastHeight; y += step) {
                  window.scrollTo(0, y);
                  await sleep(45);
                }
              }

              window.scrollTo(0, document.documentElement.scrollHeight);
              await sleep(180);
              window.scrollTo(0, 0);
              await sleep(260);
            });

            await page.waitForFunction(
              () => [...document.images].filter(img => img.getBoundingClientRect().width > 0).every(img => img.complete),
              { timeout: 10000 },
            ).catch(() => {});
          }

          async function shot(name, hash, viewport, options = {}) {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 1 });
            const page = await context.newPage();
            page.on('pageerror', error => console.log('PAGEERROR', name, error.message));
            if (options.cart) {
              await page.addInitScript(value => localStorage.setItem('safra-cart', JSON.stringify(value)), cart);
            }
            if (options.wishlist) {
              await page.addInitScript(() => localStorage.setItem('safra-wishlist', JSON.stringify(['tala-mini-bag','noor-hoops','azur-sunglasses'])));
            }
            await page.goto(`${base}${hash}`, { waitUntil: 'networkidle' });
            await page.evaluate(() => document.fonts?.ready);

            if (!options.menu) await warmLazyMedia(page);

            if (options.menu) {
              const menu = page.locator('.flagship-menu-button');
              if (await menu.count()) {
                await menu.first().click({ timeout: 5000 }).catch(() => {});
                await page.waitForTimeout(300);
              }
            }

            await page.screenshot({ path: `screenshots/${name}.png`, fullPage: true });
            await context.close();
          }

          const desktop = { width: 1440, height: 1000 };
          const mobile = { width: 390, height: 844 };

          await shot('01-home-desktop', '#/', desktop);
          await shot('02-shop-desktop', '#/shop', desktop);
          await shot('03-product-desktop', '#/product/tala-mini-bag', desktop);
          await shot('04-jewelry-desktop', '#/product/noor-hoops', desktop);
          await shot('05-about-desktop', '#/about', desktop);
          await shot('06-wishlist-desktop', '#/wishlist', desktop, { wishlist: true });
          await shot('07-bag-desktop', '#/cart', desktop, { cart: true });
          await shot('08-checkout-desktop', '#/checkout', desktop, { cart: true });
          await shot('09-home-mobile', '#/', mobile);
          await shot('10-menu-mobile', '#/', mobile, { menu: true });
          await shot('11-shop-mobile', '#/shop', mobile);
          await shot('12-product-mobile', '#/product/tala-mini-bag', mobile);
          await shot('13-bag-mobile', '#/cart', mobile, { cart: true });
          await shot('14-checkout-mobile', '#/checkout', mobile, { cart: true });

          await browser.close();
          EOF
          node capture.mjs

      - name: Run accessibility audit
        run: |
          cat > accessibility.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';

          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:4173/';
          const cart = [
            { key: 'tala-mini-bag-Sand', productId: 'tala-mini-bag', color: 'Sand', quantity: 1 },
            { key: 'noor-hoops-Gold', productId: 'noor-hoops', color: 'Gold', quantity: 1 },
          ];
          const targets = [
            { name: 'home', hash: '#/' },
            { name: 'shop', hash: '#/shop' },
            { name: 'product', hash: '#/product/tala-mini-bag' },
            { name: 'about', hash: '#/about' },
            { name: 'bag', hash: '#/cart', cart: true },
            { name: 'checkout', hash: '#/checkout', cart: true },
            { name: 'mobile-menu', hash: '#/', viewport: { width: 390, height: 844 }, menu: true },
          ];

          const report = [];
          let blocking = 0;

          for (const target of targets) {
            const context = await browser.newContext({ viewport: target.viewport || { width: 1280, height: 900 } });
            const page = await context.newPage();
            if (target.cart) {
              await page.addInitScript(value => localStorage.setItem('safra-cart', JSON.stringify(value)), cart);
            }
            await page.goto(`${base}${target.hash}`, { waitUntil: 'networkidle' });
            await page.evaluate(() => document.fonts?.ready);

            if (target.menu) {
              await page.locator('.flagship-menu-button').click();
              await page.waitForTimeout(200);
            }

            const results = await new AxeBuilder({ page })
              .withTags(['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'])
              .analyze();

            const violations = results.violations.map(item => ({
              id: item.id,
              impact: item.impact,
              help: item.help,
              helpUrl: item.helpUrl,
              nodes: item.nodes.map(node => ({ target: node.target, summary: node.failureSummary })),
            }));

            blocking += violations.filter(item => item.impact === 'serious' || item.impact === 'critical').length;
            report.push({ route: target.hash, state: target.name, violations });
            console.log(`${target.name}: ${violations.length} accessibility violations`);
            await context.close();
          }

          await fs.writeFile('accessibility-report.json', JSON.stringify(report, null, 2));
          await browser.close();

          if (blocking > 0) {
            console.error(`Accessibility audit found ${blocking} serious/critical violation group(s).`);
            process.exit(1);
          }
          EOF
          node accessibility.mjs

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safra-visual-review
          path: screenshots
          if-no-files-found: warn
          retention-days: 3

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safra-accessibility-review
          path: accessibility-report.json
          if-no-files-found: warn
          retention-days: 3
